<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credentials</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="page">
        <header class="header">
            <div>
                <p class="eyebrow">Carbon Pipeline</p>
                <h1>Credentials</h1>
                <p class="subtitle">Enter your Compute Canada account.</p>
            </div>
            <div class="badge">v2</div>
        </header>

        <section class="card">
            <form method="POST" class="form">
                {{ template_form.hidden_tag() }}
                <div class="field">
                    {{ template_form.account.label }}
                    {{ template_form.account(type="text", class="input", placeholder="Address") }}
                </div>

                <div class="actions">
                    {{ template_form.submit(class="btn", id="submit-button") }}
                </div>
            </form>
        </section>
    </div>
</body>
</html>
